# Source of truth. Built + validated by scripts/build_data.py -> public/molecules.json
#
# fragments: ordered; texts must concatenate EXACTLY to `name`.
#   role:     locant | substituent | parent | ending | suffix | separator
#   groupIds: ids from data/groups.json (a locant carries the groupIds of the
#             fragment it points to = the next atom-owning fragment)
#   atoms:    heavy-atom indices in SMILES order. locant/separator own none.
#             The suffix owns the characteristic-group atoms even if they are
#             chain carbons (C=O carbon belongs to "one", not "propan").
#   for:      (locant/descriptor only, optional) text of the fragment it points
#             at, when that is not simply the next atom-owning fragment:
#             "2-" in 2-(ethanoyloxy)... points at "oxy", the atom on the ring.
#   role descriptor: text that modifies the parent hydride and owns no atoms
#             (hydro prefixes, indicated hydrogen: "-3,7-dihydro-1H-").
# locants: {heavyAtomIndex: label} for the parent chain/ring, independent of
#          ownership. Labels are chain numbers, or a letter locant on the
#          heteroatom it names ({3: N} for an amide N cited as "N-").
# frames:  (optional) list of further {heavyAtomIndex: number} maps, one per
#          substituent ring/chain that has its own locants ("4-" in
#          N-(4-hydroxyphenyl)...). Atom 1 is the point of attachment.
# numbering: fixed  (optional) retained fused parent (purine): numbers are data,
#          may sit on heteroatoms, and are exempt from the path/lowest checks.

# ---------------------------------------------------------------- T1

- id: ethanol
  name: ethanol
  commonName: ethyl alcohol
  smiles: CCO            # 0:C 1:C 2:O
  tier: 1
  tags: [alcohol]
  fragments:
    - { text: "ethan", role: parent, groupIds: [parent],   atoms: [0, 1] }
    - { text: "ol",    role: suffix, groupIds: [hydroxyl], atoms: [2] }
  locants: { 1: 1, 0: 2 }

