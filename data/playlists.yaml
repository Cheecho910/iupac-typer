# Ordered playlists. Built + validated by scripts/build_data.py: every id must
# exist, and every molecule must be in at least one playlist. Order is the
# ramp: with "Unlock in order" on, later molecules open up as earlier ones
# reach level 2. Levels are per molecule and shared between playlists.

- id: foundations
  name: Beginner
  description: Chains, one functional group at a time, then branches, acids and rings.
  molecules:
    - ethanol
    - propan-1-ol
    - propan-2-ol
    - chloroethane
    - propan-1-amine
    - ethanal
    - propan-2-one
    - butan-2-one
    - prop-1-ene
    - but-1-yne
    - 2-methylpropan-1-ol
    - 2-methylpropan-2-ol
    - 3-methylbutan-1-ol
    - 1-chloro-2-methylpropane
    - ethanoic-acid
    - propanoic-acid
    - ethyl-ethanoate
    - methyl-propanoate
    - propanamide
    - benzene
    - methylbenzene
    - phenol
    - cyclohexanol
    - cyclohexanone

